
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Chatsong - Blind Drop Radio & Playlist Engine</title>
  <style>
    :root {
      --bg: #0f0f12;
      --card: #18181f;
      --accent: #8b5cf6;
      --chatsong: #6366f1;
      --text: #ffffff;
      --muted: #a1a1aa;
      --border: #27272a;
      --success: #10b981;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background: var(--bg); color: var(--text); padding: 10px; display: flex; justify-content: center; }
    .app { width: 100%; max-width: 460px; display: flex; flex-direction: column; gap: 12px; }
    
    .card { background: var(--card); border: 1px solid var(--border); border-radius: 14px; padding: 16px; }
    .badge { display: inline-block; background: rgba(139, 92, 246, 0.2); color: var(--accent); padding: 3px 8px; border-radius: 6px; font-size: 0.7rem; font-weight: bold; margin-bottom: 8px; }

    /* Player Container & Mask */
    .player-wrapper { position: relative; width: 100%; height: 190px; border-radius: 10px; overflow: hidden; background: #000; margin: 10px 0; border: 1px solid var(--border); }
    .mask-overlay { position: absolute; top: 0; left: 0; right: 0; bottom: 0; background: #18181f; display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 10; transition: opacity 0.4s ease; text-align: center; padding: 12px; }
    .mask-overlay.unlocked { opacity: 0; pointer-events: none; }

    iframe { width: 100%; height: 100%; border: none; }
    audio { width: 100%; margin-top: 10px; }

    /* Timer & Controls */
    .progress-bar { width: 100%; height: 5px; background: #27272a; border-radius: 3px; overflow: hidden; margin: 8px 0; }
    .progress-fill { height: 100%; width: 0%; background: var(--accent); transition: width 0.2s linear; }
    .timer-text { font-size: 0.75rem; color: var(--muted); text-align: center; }

    .playlist-controls { display: flex; justify-content: space-between; gap: 8px; margin-top: 10px; }
    .btn { flex: 1; padding: 10px; border-radius: 8px; border: none; font-weight: bold; cursor: pointer; font-size: 0.85rem; background: var(--accent); color: white; text-align: center; text-decoration: none; }
    .btn-secondary { background: #27272a; }
    .btn-chatsong { background: var(--chatsong); }

    .status-box { background: rgba(99, 102, 241, 0.1); border: 1px dashed var(--chatsong); border-radius: 8px; padding: 10px; text-align: center; font-size: 0.8rem; margin-top: 10px; }
  </style>
</head>
<body>

<div class="app">
  <div class="card">
    <span class="badge">👁️ BLIND DROP COMMUNITY PLAYLIST</span>
    
    <!-- Player Wrapper -->
    <div class="player-wrapper">
      <div class="mask-overlay" id="maskOverlay">
        <div style="font-size: 1.5rem;">🔒</div>
        <div style="font-weight: bold; margin-top: 4px;" id="trackCounter">Mystery Track #1</div>
        <div style="font-size: 0.75rem; color: var(--muted);" id="platformTag">Streams counting...</div>
      </div>
      <div id="mediaContainer"></div>
    </div>

    <!-- Progress Timer -->
    <div class="progress-bar"><div class="progress-fill" id="progressFill"></div></div>
    <div class="timer-text" id="timerText">Listen 30 seconds to boost stream & unlock profile</div>

    <!-- Playlist Controls -->
    <div class="playlist-controls">
      <button class="btn btn-secondary" onclick="prevTrack()">⏮️ Prev</button>
      <button class="btn btn-secondary" onclick="nextTrack()">Next Track ⏭️</button>
    </div>

    <!-- Sign-Up Gate -->
    <div class="status-box" id="gateBox">
      <strong>⚡ We Are Different!</strong><br>
      Listening builds real streams for indie artists. Sign up on Chatsong to reveal who this is!
      <button class="btn btn-chatsong" style="width:100%; margin-top:8px;" onclick="redirectToSignUp()">
        Sign Up on Chatsong to Reveal 🔓
      </button>
    </div>

    <!-- Unlocked State Links -->
    <div id="unlockedInfo" style="display:none; margin-top: 10px;">
      <a href="#" id="profileBtn" target="_blank" class="btn btn-chatsong" style="display:block; margin-bottom:6px;">👤 View Artist Profile</a>
      <a href="#" id="streamBtn" target="_blank" class="btn btn-secondary" style="display:block;">🔗 Open Original Stream Link</a>
    </div>
  </div>
</div>

<script>
  // ZELFGEMAAKTE PLAYLIST ARRAY (Dynamisch aan te vullen vanuit formulier of database)
  const playlist = [
    {
      id: 1,
      url: "https://soundcloud.com/chatsongmusic/pulse-after-panic",
      profile: "https://chatsong.nl/u/3595621177773146902",
      type: "soundcloud"
    },
    {
      id: 2,
      url: "https://www.youtube.com/watch?v=dQw4w9WgXcQ",
      profile: "https://chatsong.nl",
      type: "youtube"
    }
  ];

  let currentIndex = 0;
  let listenedSeconds = 0;
  let timerInterval = null;
  const FLARUM_REGISTER_URL = "https://chatsong.nl/register";

  function loadTrack(index) {
    clearInterval(timerInterval);
    listenedSeconds = 0;
    document.getElementById('progressFill').style.width = '0%';
    document.getElementById('maskOverlay').classList.remove('unlocked');
    document.getElementById('unlockedInfo').style.display = 'none';

    const item = playlist[index];
    document.getElementById('trackCounter').innerText = `Mystery Track #${index + 1} of ${playlist.length}`;
    
    const container = document.getElementById('mediaContainer');
    
    if (item.url.includes('soundcloud.com')) {
      const embedUrl = `https://w.soundcloud.com/player/?url=${encodeURIComponent(item.url)}&color=%238b5cf6&auto_play=true&hide_related=true&show_comments=false`;
      container.innerHTML = `<iframe src="${embedUrl}"></iframe>`;
    } else if (item.url.includes('youtube.com') || item.url.includes('youtu.be')) {
      const ytId = item.url.match(/(?:youtu\.be\/|youtube\.com\/(?:watch\?v=|shorts\/))([\w-]{11})/)[1];
      container.innerHTML = `<iframe src="https://www.youtube.com/embed/${ytId}?autoplay=1"></iframe>`;
    }

    startTimer();
  }

  function startTimer() {
    timerInterval = setInterval(() => {
      if (listenedSeconds < 30) {
        listenedSeconds++;
        const percent = (listenedSeconds / 30) * 100;
        document.getElementById('progressFill').style.width = percent + '%';
        document.getElementById('timerText').innerText = `Listening... ${30 - listenedSeconds}s left to record stream`;
      } else {
        clearInterval(timerInterval);
        document.getElementById('timerText').innerText = "✅ Stream counted! Sign up below to unlock artist identity.";
      }
    }, 1000);
  }

  function nextTrack() {
    currentIndex = (currentIndex + 1) % playlist.length;
    loadTrack(currentIndex);
  }

  function prevTrack() {
    currentIndex = (currentIndex - 1 + playlist.length) % playlist.length;
    loadTrack(currentIndex);
  }

  function redirectToSignUp() {
    // Bewaar huidige track context en stuur door naar Flarum Sign-Up
    window.top.location.href = `${FLARUM_REGISTER_URL}?ref=blind_drop_track_${playlist[currentIndex].id}`;
  }

  // Initialiseer eerste track
  loadTrack(0);
</script>

</body>
</html>
